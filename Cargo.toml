[package]
name = "gpu-setfan"
authors = ["Marvin Lücke"]
description = "GPU fan control via temperature setpoint"
readme = "README.md"
homepage = "https://github.com/lueckem/gpu-setfan"
repository = "https://github.com/lueckem/gpu-setfan"
categories = ["hardware-support"]
keywords = ["hardware", "gpu", "fan", "temperature"]
license = "MIT"
edition = "2024"
rust-version = "1.94.0"
version = "0.2.1"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
nvml-wrapper = "0.12.1"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
